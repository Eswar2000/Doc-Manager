<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Completing Sign-in</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      /* Tailwind equivalent gradient */
      background: linear-gradient(to bottom right,
          #1e1b4b,
          /* indigo-950 */
          #020617,
          /* slate-950 */
          #020617
          /* slate-950 */
        );

      font-family: system-ui, -apple-system, sans-serif;
      color: #c7d2fe;
      /* indigo-200 */
    }

    .container {
      text-align: center;
    }

    .text {
      font-size: 18px;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="text">Please wait...</div>
  </div>

  <script type="module">
    import { broadcastResponseToMainFrame } from "@azure/msal-browser/redirect-bridge";

    broadcastResponseToMainFrame()
      .catch((error) => {
        console.error("MSAL redirect bridge failed:", error);
      })
      .finally(() => {
        window.close();
      });
  </script>
</body>

</html>
